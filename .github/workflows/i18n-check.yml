name: i18n Key Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  i18n-check:
    name: i18n 키 누락 검사
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: i18n 키 검사 (누락/빈 값 시 실패)
        run: node ./scripts/i18n-check-keys.mjs
